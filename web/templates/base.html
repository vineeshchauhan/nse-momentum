<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NSE Momentum{% endblock %}</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">
  <style>
    .badge-success  { background-color: #198754; }
    .badge-failure  { background-color: #dc3545; }
    .badge-skipped  { background-color: #ffc107; color: #000; }
    .result-pos     { color: #198754; font-weight: 600; }
    .result-neg     { color: #dc3545; font-weight: 600; }
    .row-entry      { background-color: #d1e7dd; }
    .row-exit       { background-color: #f8d7da; }
    .date-heading   { background-color: #f8f9fa; font-weight: 600; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="/">NSE Momentum</a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#navMenu">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navMenu">
    <ul class="navbar-nav ms-3">
      <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="/btst">BTST</a></li>
      <li class="nav-item"><a class="nav-link" href="/momentum">Momentum</a></li>
    </ul>
  </div>
</nav>
<div class="container-fluid py-4">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmLQqMPHUCW8dP5+jFDXlkBh3YV"
        crossorigin="anonymous"></script>
</body>
</html>
